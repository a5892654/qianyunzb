<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>大碗白饭 · 千音透明直播源</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
canvas{position:fixed;left:2vh;bottom:2vh;width:34.286vh;height:16vh;image-rendering:pixelated;pointer-events:none}
</style>
<canvas width="720" height="336" aria-label="AI 通关白饭累计"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const sheet=new Image(); sheet.src='/static/assets/rice_bowl_celebrate.png';
let state={enabled:false,total:0,celebrated_at:0},lastSuccess=0;
function update(value){state=value;lastSuccess=Date.now();}
async function refresh(){try{const r=await fetch('/api/rice/state',{cache:'no-store'});if(r.ok)update(await r.json());}catch(e){}}
function connect(){const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind==='rice')update(m);}catch(e){}};ws.onclose=()=>setTimeout(connect,1500);ws.onopen=refresh;}
function draw(){
 ctx.clearRect(0,0,720,336);ctx.save();ctx.scale(2,2);
 if(state.enabled&&Date.now()-lastSuccess<6000&&sheet.complete&&sheet.naturalWidth){
  const age=Date.now()/1000-state.celebrated_at,animated=age>=0&&age<2.4,i=animated?Math.floor(age*12)%8:0;
  ctx.fillStyle='rgba(22,25,36,.895)';ctx.strokeStyle='rgba(206,175,120,.824)';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(1,26,358,141,14);ctx.fill();ctx.stroke();
  ctx.imageSmoothingEnabled=false;const cw=sheet.naturalWidth/4,ch=sheet.naturalHeight/2;
  ctx.drawImage(sheet,i%4*cw,Math.floor(i/4)*ch,cw,ch,3,29,134,134);
  ctx.font='18px "Microsoft YaHei",sans-serif';ctx.fillStyle='#e7d4b0';ctx.fillText('大碗白饭',145,62);
  ctx.font='42px "Microsoft YaHei",sans-serif';ctx.fillStyle='#fff5d8';ctx.fillText(`${state.total} 碗`,142,111);
  ctx.font='13px "Microsoft YaHei",sans-serif';ctx.fillStyle='#bcb4a7';ctx.fillText('AI 通关 · 开饭！',145,145);
  if(animated){ctx.font='23px "Microsoft YaHei",sans-serif';ctx.fillStyle='#ffdd81';ctx.fillText('+1 碗！',160,23);}
 }
 ctx.restore();requestAnimationFrame(draw);
}
sheet.onload=()=>requestAnimationFrame(draw);setInterval(refresh,1000);refresh();connect();
</script>
</html>
